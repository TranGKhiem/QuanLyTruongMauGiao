<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}Tiêu đề trang{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { min-height: 100vh; background-color: #f8f9fa; margin: 0; display: flex;}
        #wrapper { display: flex; width: 100%; }
        #sidebar { width: 250px; min-height: 100vh; background-color: #2c3e50; color: white; }
        #sidebar .nav-link { color: #bdc3c7; padding: 15px 20px; border-bottom: 1px solid #34495e; }
        #sidebar .nav-link:hover, #sidebar .nav-link.active { color: #ffffff; background-color: #34495e; border-left: 4px solid #3498db; }
        #page-content-wrapper { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-content { flex-grow: 1; }
    </style>
</head>
<body>
    <div id="wrapper">
        <!-- Sidebar Menu bên trái -->
        <nav id="sidebar">
            <div class="sidebar-header p-3 text-center border-bottom border-secondary">
                <h5 class="m-0 fw-bold text-uppercase text-light">Mẫu Giáo App</h5>
            </div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a href="/" class="nav-link active"><i class="fas fa-users me-2"></i> Danh sách lớp</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-heartbeat me-2"></i> Sức khoẻ</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-file-invoice-dollar me-2"></i> Thu học phí</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-chart-pie me-2"></i> Báo cáo - Thống kê</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-cogs me-2"></i> Cài đặt quy định</a></li>
            </ul>
        </nav>

        <!-- Vùng nội dung bên phải -->
        <div id="page-content-wrapper">

            <!-- 1. GỌI HEADER TỪ FILE RIÊNG -->
            {% include 'layout/header.html' %}

            <!-- 2. VÙNG NỘI DUNG ĐỘNG CỦA TỪNG TRANG -->
            <div class="container-fluid px-4 pt-4 main-content">
                {% block content %}
                <!-- Nội dung các trang con sẽ tự động đổ vào đây -->
                {% endblock %}
            </div>

            <!-- 3. GỌI FOOTER TỪ FILE RIÊNG -->
            {% include 'layout/footer.html' %}

        </div>
    </div>
</body>
</html>
